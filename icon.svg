<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" role="img" aria-label="Grid database workbench">
  <defs>
    <linearGradient id="grid-accent" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--dsw-alias-brand-primary, #3b82f6)" stop-opacity="0.95"/>
      <stop offset="1" stop-color="var(--dsw-alias-brand-primary, #3b82f6)" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <!-- Database cylinder -->
  <ellipse cx="12" cy="5.6" rx="7.1" ry="2.9" stroke="currentColor" stroke-width="1.5"/>
  <path d="M4.9 5.6v12.8c0 1.6 3.18 2.9 7.1 2.9s7.1-1.3 7.1-2.9V5.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M4.9 9.9c0 1.6 3.18 2.9 7.1 2.9s7.1-1.3 7.1-2.9" stroke="currentColor" stroke-width="1.5"/>
  <path d="M4.9 14.2c0 1.6 3.18 2.9 7.1 2.9s7.1-1.3 7.1-2.9" stroke="currentColor" stroke-width="1.5"/>
  <!-- Grid column accent: the "table inside the database" -->
  <rect x="10.55" y="9.55" width="2.9" height="10.9" rx="1.2" fill="url(#grid-accent)"/>
  <path d="M10.55 14.2h2.9" stroke="var(--dsw-alias-bg-base, #ffffff)" stroke-width="1.1" stroke-opacity="0.85"/>
</svg>
